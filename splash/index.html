<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>reitrn Warehouse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FFFFFF; height: 100vh; overflow: hidden; user-select: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    .wordmark { font-size: 44px; font-weight: 900; letter-spacing: -1.5px; line-height: 1; white-space: nowrap; }
    .sub { font-size: 10px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
    .bar { width: 120px; height: 3px; border-radius: 2px; background: #ECECF1; overflow: hidden; position: relative; }
    .bar::after {
      content: ''; position: absolute; left: -40%; top: 0; height: 100%; width: 40%;
      border-radius: 2px; background: var(--g-end, #00B89A);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
  </style>
</head>
<body>
  <div class="wordmark"><span id="wm">reitrn</span><span id="dot">.</span></div>
  <div class="sub" id="sub">warehouse</div>
  <div class="bar"></div>
  <script>
    // Living gradient — pure date maths, the same formula as the app icon and
    // the Station settings header; all roll over together at the week boundary.
    (function () {
      var A = ['#C21460','#8601AF','#4424D6','#0247FE','#347C98','#66B032','#B2D732','#FEFE33','#FABC02','#FB9902','#FD5308','#FE2712'];
      function h2r(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
      function r2hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0,s=0,l=(mx+mn)/2;if(d){s=l>0.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=((b-r)/d+2);else h=((r-g)/d+4);h*=60;}return{h:h,s:s,l:l};}
      function hsl2hex(h,s,l){h=(h%360+360)%360;s=Math.max(0,Math.min(1,s));l=Math.max(0,Math.min(1,l));var c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r,g,b;if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}else if(h<180){r=0;g=c;b=x;}else if(h<240){r=0;g=x;b=c;}else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;}function t(v){v=Math.round((v+m)*255);return('0'+v.toString(16)).slice(-2);}return('#'+t(r)+t(g)+t(b)).toUpperCase();}
      function lerpH(a,b,t){var d=b-a;if(d>180)d-=360;if(d<-180)d+=360;return a+d*t;}
      function rgblerp(a,b,t){function p(v){return('0'+Math.round(v).toString(16)).slice(-2);}return('#'+p(a[0]+(b[0]-a[0])*t)+p(a[1]+(b[1]-a[1])*t)+p(a[2]+(b[2]-a[2])*t)).toUpperCase();}
      var HSL = A.map(function (a) { var r = h2r(a); return r2hsl(r[0], r[1], r[2]); });
      function baseHsl(frac){var pos=frac*12,i=Math.floor(pos),t=pos-i;i=((i%12)+12)%12;var j=(i+1)%12,X=HSL[i],Y=HSL[j];return{h:lerpH(X.h,Y.h,t),s:X.s+(Y.s-X.s)*t,l:X.l+(Y.l-X.l)*t};}
      var DR=[254,39,18],DT=[0,184,154],DW=[];for(var k=0;k<52;k++){if(Math.floor(k/52*12)===11)DW.push(k);}
      var d=new Date(),s0=new Date(d.getFullYear(),0,1),w=Math.max(0,Math.min(51,Math.floor((d-s0)/(7*86400000))));
      var g;
      if(Math.floor(w/52*12)===11){var i2=DW.indexOf(w),n=DW.length;g={start:rgblerp(DR,DT,i2/n),end:rgblerp(DR,DT,(i2+1)/n)};}
      else{var b0=baseHsl((w+0.5)/52);g={start:hsl2hex(b0.h-14,b0.s,b0.l+0.10),end:hsl2hex(b0.h+14,b0.s,b0.l-0.10)};}
      var wm=document.getElementById('wm');
      wm.style.background='linear-gradient(90deg,'+g.start+','+g.end+')';
      wm.style.webkitBackgroundClip='text';wm.style.backgroundClip='text';wm.style.webkitTextFillColor='transparent';
      document.getElementById('dot').style.color=g.end;
      document.getElementById('sub').style.color=g.end;
      document.documentElement.style.setProperty('--g-end', g.end);
    })();
  </script>
</body>
</html>
